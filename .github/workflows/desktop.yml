name: Hub desktop installers
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Installer targets
        type: choice
        options: [windows, all]
        default: windows
      publishRun:
        description: Successful Windows run to attach to an existing draft (empty builds installers)
        type: string
        default: ''
  push:
    branches: [codex/hub-foundation-kanban]
    paths: [src-tauri/**, scripts/windows-smoke.ps1, scripts/updater-verifier/**, package.json, package-lock.json, .github/workflows/desktop.yml]
permissions:
  contents: read
jobs:
  package:
    if: ${{ inputs.publishRun == '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && '[{"os":"ubuntu-24.04","bundle":"deb"},{"os":"windows-latest","bundle":"nsis"},{"os":"macos-latest","bundle":"dmg"}]' || '[{"os":"windows-latest","bundle":"nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before building releases.' >&2
            exit 1
          fi
      - name: Validate updater key before compiling
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/hub-signing-check.bin"
          printf 'Hub updater signing preflight' > "$fixture"
          app_version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          npx tauri signer sign --app-version "$app_version" "$fixture"
          cargo run --locked --manifest-path scripts/updater-verifier/Cargo.toml -- src-tauri/tauri.conf.json "$fixture"
          rm -f "$fixture" "$fixture.sig"
      - name: Build installer and signed updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Windows install, launch, shortcut and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing.' }
          ./scripts/windows-smoke.ps1 -Installer $installer.FullName
      - name: Verify signed Windows update and reject tampering
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing.' }
          cargo run --locked --manifest-path scripts/updater-verifier/Cargo.toml -- src-tauri/tauri.conf.json $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature validation failed.' }
      - name: Save installer and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hub-${{ runner.os }}-unsigned
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/Cargo.lock
            ${{ runner.temp }}/hub-desktop-evidence/**
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publishRun != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Attach verified Windows installer to draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.publishRun }}
        run: node scripts/publish-desktop-draft.mjs
