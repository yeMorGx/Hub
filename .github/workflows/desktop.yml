name: Hub desktop installers
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Installer targets
        type: choice
        options: [windows, all]
        default: windows
      verifyRun:
        description: Completed Windows build to retest when native source/configuration is unchanged
        type: string
        default: ''
      publishRun:
        description: Successful Windows run to attach to an existing draft (empty builds installers)
        type: string
        default: ''
  push:
    branches: [codex/hub-foundation-kanban]
    paths: [src-tauri/**, scripts/windows-smoke.ps1, scripts/updater-verifier/**, package.json, package-lock.json, .github/workflows/desktop.yml]
permissions:
  contents: read
jobs:
  package:
    if: ${{ inputs.publishRun == '' && inputs.verifyRun == '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && '[{"os":"ubuntu-24.04","bundle":"deb"},{"os":"windows-latest","bundle":"nsis"},{"os":"macos-latest","bundle":"dmg"}]' || '[{"os":"windows-latest","bundle":"nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before building releases.' >&2
            exit 1
          fi
      - name: Validate updater key before compiling
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/hub-signing-check.bin"
          node -e 'const k=process.env.TAURI_SIGNING_PRIVATE_KEY.trim(); console.log("Signing key character count:",k.length); if(!Buffer.from(k,"base64").toString("utf8").startsWith("untrusted comment:")) { console.error("Use the complete generated key file contents, not the decoded inner key or file path."); process.exit(1); }'
          printf 'Hub updater signing preflight' > "$fixture"
          app_version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          npx tauri signer sign --app-version "$app_version" "$fixture"
          cargo run --locked --manifest-path scripts/updater-verifier/Cargo.toml -- src-tauri/tauri.conf.json "$fixture"
          rm -f "$fixture" "$fixture.sig"
      - name: Build installer and signed updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Windows install, launch, shortcut and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing.' }
          ./scripts/windows-smoke.ps1 -Installer $installer.FullName
      - name: Verify signed Windows update and reject tampering
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing.' }
          cargo run --locked --manifest-path scripts/updater-verifier/Cargo.toml -- src-tauri/tauri.conf.json $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature validation failed.' }
      - name: Save installer and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hub-${{ runner.os }}-unsigned
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/Cargo.lock
            ${{ runner.temp }}/hub-desktop-evidence/**
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publishRun != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Attach verified Windows installer to draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.publishRun }}
        run: node scripts/publish-desktop-draft.mjs

  verify-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.verifyRun != ''
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Validate provenance and download exact built artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.verifyRun }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Numeric source run required.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/desktop.yml' -or $run.status -ne 'completed' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_branch -ne 'codex/hub-foundation-kanban') { throw 'Unrecognized build provenance.' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN/jobs" | ConvertFrom-Json
          $build = @($jobs.jobs.steps | Where-Object { $_.name -eq 'Build installer and signed updater package' -and $_.conclusion -eq 'success' })
          if ($build.Count -ne 1) { throw 'The source must have built and signed its installer successfully.' }
          git diff --exit-code $run.head_sha HEAD -- src-tauri
          if ($LASTEXITCODE -ne 0) { throw 'Native sources/configuration/icons differ. Rebuild instead.' }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name Hub-Windows-unsigned --dir source-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = @(Get-ChildItem source-artifact -Recurse -Filter "Hub_${version}_x64-setup.exe")
          $report = @(Get-ChildItem source-artifact -Recurse -Filter smoke.json)
          if ($installer.Count -ne 1 -or $report.Count -ne 1) { throw 'Expected one installer and original report.' }
          $original = Get-Content $report[0].FullName -Raw | ConvertFrom-Json
          $hash = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($original.sha256 -ne $hash -or -not (Test-Path "$($installer[0].FullName).sig")) { throw 'Source artifact identity mismatch.' }
          New-Item -ItemType Directory -Path verified-desktop | Out-Null
          Copy-Item $installer[0].FullName verified-desktop
          Copy-Item "$($installer[0].FullName).sig" verified-desktop
          @{ sourceRun = [long]$env:SOURCE_RUN; sourceCommit = $run.head_sha; verificationCommit = $env:GITHUB_SHA; nativeTreeMatches = $true; sha256 = $hash } | ConvertTo-Json | Set-Content verified-desktop/provenance.json -Encoding utf8
      - name: Test actual Windows controls and installer lifecycle
        shell: powershell
        run: |
          $installer = Get-ChildItem verified-desktop -Filter '*-setup.exe' | Select-Object -First 1
          ./scripts/windows-smoke.ps1 -Installer $installer.FullName -OutputDirectory "$pwd/verified-desktop"
      - name: Verify existing updater signature and reject tampering
        shell: powershell
        run: |
          $installer = Get-ChildItem verified-desktop -Filter '*-setup.exe' | Select-Object -First 1
          cargo run --locked --manifest-path scripts/updater-verifier/Cargo.toml -- src-tauri/tauri.conf.json $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Updater verification failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Hub-Windows-unsigned
          path: verified-desktop/**
          retention-days: 14
