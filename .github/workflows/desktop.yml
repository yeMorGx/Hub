name: Hub desktop installers
on:
  workflow_dispatch:
  push:
    branches: [codex/hub-foundation-kanban]
    paths: [src-tauri/**, package.json, package-lock.json, .github/workflows/desktop.yml]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build installer (unsigned preview)
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hub-${{ runner.os }}-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
